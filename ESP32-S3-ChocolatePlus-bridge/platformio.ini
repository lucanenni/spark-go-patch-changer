; ESP32-S3 pocket dongle -> MVave Chocolate Plus (USB-MIDI) -> Spark GO (BLE) bridge.
; See README.md for board notes and CubeSuite footswitch programming instructions.

[env:esp32-s3-dongle]
; CRITICAL, hard-won: this MUST be espressif32@6.4.0 (Arduino-ESP32 core
; 2.0.11, esp-idf v4.4.5 commit ac5d805d0e) - not the default/latest
; platform version, not any other nearby 2.x/3.x version. This board's
; ESP32-S3 silicon is an old revision (esptool reports "revision v0.2") that
; simply doesn't boot - no crash, no output, nothing on screen, ever - with
; other esp-idf builds. Confirmed by: the vendor's own precompiled demo
; firmware boots fine; recompiling their EXACT unmodified sketch through our
; own PlatformIO/arduino-cli setups failed until the embedded `esp-idf: vX`
; string (visible via `strings firmware.bin | grep esp-idf`) was made to
; match their binary's v4.4.5/ac5d805d0e exactly - every other IDF version
; tried (4.4.4, and the whole 5.x line via newer platform releases) silently
; never boots on this specific board. If you ever bump this platform
; version, re-verify against real hardware first - don't assume "newer is
; fine" here.
platform = espressif32@6.4.0
framework = arduino
; No upstream board definition for this AliExpress/GNPE clone of the LilyGO
; T-Dongle-S3, so we start from the generic devkit and override memory/USB
; settings below to match the real module (ESP32-S3 N16R8: 16MB flash).
board = esp32-s3-devkitc-1

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; Deliberately NOT setting board_build.arduino.memory_type (e.g. qio_opi) -
; PSRAM turned out not to be the boot-failure cause (that was the esp-idf
; version above), but the vendor's own working firmware doesn't reference
; PSRAM at all either (checked their .map file), and nothing in this
; codebase needs it, so leaving it disabled matches the known-good
; reference exactly rather than reintroducing an unverified variable.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; Excludes displaytest_main.cpp/miditest_main.cpp/bletest_main.cpp (each has
; its own setup()/loop(), only meant to be built by their own env below).
build_src_filter = +<*> -<displaytest_main.cpp> -<miditest_main.cpp> -<bletest_main.cpp>

build_unflags =
    -std=gnu++11

build_flags =
    ; The espressif32 platform defaults to gnu++11; this codebase uses
    ; C++17 (inline constexpr namespace-scope variables in config.h etc).
    -std=gnu++17

    ; Native USB (TinyUSB) instead of the hardware CDC/JTAG USB mode, so the
    ; USB-A plug enumerates as a class-compliant USB-MIDI device rather than a
    ; serial port when plugged into the Chocolate Plus's HOST port.
    ;
    ; Deliberately NOT setting ARDUINO_USB_CDC_ON_BOOT=1 to also get a Serial
    ; console over this same port: that pulls in the Arduino core's own
    ; prebuilt TinyUSB stack (libarduino_tinyusb.a) alongside the
    ; Adafruit_TinyUSB library's own copy used for the MIDI class - confirmed
    ; to fail at link time with "multiple definition of usbd_edpt_*" (both
    ; providing the same core USB device stack). Debugging setup() instead
    ; uses on-screen checkpoints (see main.cpp) since the display is already
    ; confirmed working - no need for a second USB personality at all.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; TFT_eSPI configured entirely via build flags (no edited library files).
    ; Matched byte-for-byte against the vendor's own working User_Setup.h
    ; (from their Pocket-Dongle-S3-0.96-demo support package) after the
    ; display showed nothing at all with our earlier guessed config - the two
    ; defines that were actually missing (not present in our first attempt,
    ; confirmed present in the vendor's proven-working setup) are
    ; TFT_RGB_ORDER=TFT_BGR and TFT_INVERSION_ON. No TFT_BL define at all,
    ; also matching the vendor - the backlight isn't GPIO-managed by
    ; TFT_eSPI in their setup either (consistent with it being hardwired on).
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DST7735_GREENTAB160x80=1
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=12
    -DTFT_DC=13
    -DTFT_RST=14
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    ; Pinned to 2.2.7 (released 2023-11-09), close to the Arduino-ESP32
    ; core/esp-idf version above (core 2.0.11, 2023-07-24) - the newer
    ; 3.1.0 initially used here reboots the board right during
    ; midi_bridge::begin()'s TinyUSB init (confirmed via the on-screen boot
    ; checkpoints: gets past "display OK", never reaches "USB-MIDI OK").
    ; 2.2.2 (the closer date match) doesn't compile against MIDI Library's
    ; MIDI_CREATE_INSTANCE macro - Adafruit_USBD_MIDI's API changed between
    ; 2.2.2 and 2.2.7. Not yet confirmed on real hardware - see README.
    adafruit/Adafruit TinyUSB Library @ 2.2.7
    fortyseveneffects/MIDI Library @ ^5.0.2
    h2zero/NimBLE-Arduino @ ^1.4.1
    bodmer/TFT_eSPI @ ^2.5.43

monitor_speed = 115200

; Isolated display-only diagnostic build (src/displaytest_main.cpp) - no
; BLE/USB-MIDI code at all, so this one CAN safely turn on the native USB
; serial console (the multiple-definition conflict noted above only happens
; when Adafruit_TinyUSB is also linked in, and it isn't here since nothing
; in displaytest_main.cpp includes it). Flash with:
;   pio run -e esp32-s3-dongle-displaytest --target upload
; then `pio device monitor -e esp32-s3-dongle-displaytest` over the same
; USB-A cable, no external adapter needed - see the comment at the top of
; displaytest_main.cpp for what you should see on screen.
[env:esp32-s3-dongle-displaytest]
extends = env:esp32-s3-dongle
build_src_filter = +<displaytest_main.cpp>
; Overrides (not appends) the inherited lib_deps: Adafruit TinyUSB Library
; and MIDI Library aren't used by displaytest_main.cpp, but PlatformIO links
; everything listed in lib_deps regardless of what's actually #included - so
; leaving them in here would hit the same usbd_edpt_* conflict as enabling
; ARDUINO_USB_CDC_ON_BOOT=1 in the real firmware's env. Dropping NimBLE too
; since it's just as unnecessary for a display-only test.
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ${env:esp32-s3-dongle.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Isolated USB-MIDI-only diagnostic build (src/miditest_main.cpp) - no
; BLE/display code at all, so it isolates whether the dongle enumerates as a
; USB-MIDI device on its own, without NimBLE/TFT_eSPI running alongside it.
; No CDC serial here (same Adafruit_TinyUSB-vs-CDC conflict as the real
; firmware) - check from the host OS side (Audio MIDI Setup > MIDI Studio)
; instead. Flash with:
;   pio run -e esp32-s3-dongle-miditest --target upload
[env:esp32-s3-dongle-miditest]
extends = env:esp32-s3-dongle
build_src_filter = +<miditest_main.cpp>
lib_deps =
    adafruit/Adafruit TinyUSB Library @ 2.2.7
    fortyseveneffects/MIDI Library @ ^5.0.2
    bodmer/TFT_eSPI @ ^2.5.43

; Isolated BLE-only diagnostic build (src/bletest_main.cpp) - no USB-MIDI/
; display code at all, so no Adafruit_TinyUSB in this build either - CDC
; serial CAN be enabled here, unlike the real firmware, giving direct
; visibility into the Spark GO BLE connection (raw notification hex dumps,
; connection/preset/tuner events, interactive commands) without needing the
; Chocolate Plus at all. Flash with:
;   pio run -e esp32-s3-dongle-bletest --target upload
; then `pio device monitor -e esp32-s3-dongle-bletest -b 115200` - see the
; comment at the top of bletest_main.cpp for available commands.
[env:esp32-s3-dongle-bletest]
extends = env:esp32-s3-dongle
build_src_filter = +<bletest_main.cpp> +<spark_ble.cpp> +<spark_protocol.cpp> +<spark_state.cpp>
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
    ${env:esp32-s3-dongle.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
