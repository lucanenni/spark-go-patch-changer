<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark GO GUI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="rack">

  <header>
    <div>
      <h1>Spark<span>GO</span> GUI</h1>
      <div class="subtitle" data-i18n="subtitle">BLE control panel - Web Bluetooth</div>
    </div>
    <div class="header-right">
      <div class="lang-row">
        <label for="langSelect" data-i18n="label_language">Language</label>
        <select id="langSelect">
          <option value="en">English</option>
          <option value="it">Italiano</option>
        </select>
      </div>
      <div class="led-row">
        <div class="led" id="statusLed"></div>
        <div class="status-text" id="statusText">Ready</div>
      </div>
    </div>
  </header>

  <div class="panel" data-label="BLE connection" data-i18n-label="panel_connection">
    <div class="row">
      <label data-i18n="label_name_filter">Name filter</label>
      <input type="text" id="nameFilter" class="filter" value="Spark">
      <button id="btnScan" class="primary" data-i18n="btn_scan">Scan</button>
    </div>
    <div class="row">
      <select id="deviceSelect" disabled>
        <option value="" data-i18n="option_no_device">- no device selected -</option>
      </select>
      <button id="btnConnect" disabled data-i18n="btn_connect">Connect</button>
      <button id="btnDisconnect" class="danger" disabled data-i18n="btn_disconnect">Disconnect</button>
    </div>
  </div>

  <div class="panel" data-label="Send patch" data-i18n-label="panel_send_patch">
    <div class="footswitches">
      <button class="fsw" data-patch="1" disabled><span class="dot"></span>1</button>
      <button class="fsw" data-patch="2" disabled><span class="dot"></span>2</button>
      <button class="fsw" data-patch="3" disabled><span class="dot"></span>3</button>
      <button class="fsw" data-patch="4" disabled><span class="dot"></span>4</button>
    </div>
  </div>

  <div class="panel" data-label="Tuner" data-i18n-label="panel_tuner">
    <div class="row">
      <button id="btnTunerOn" class="primary" disabled data-i18n="btn_tuner_on">Tuner ON</button>
      <button id="btnTunerOff" class="danger" disabled data-i18n="btn_tuner_off">Tuner OFF</button>
    </div>
  </div>

  <div class="panel" data-label="Tuner display (raw, uncalibrated)" data-i18n-label="panel_tuner_display">
    <div class="tuner-display">
      <div class="tuner-note idle" id="tunerNote">&mdash;</div>
      <div class="tuner-gauge">
        <div class="tuner-bar">
          <div class="zone"></div>
          <div class="tick" style="left:0%"></div>
          <div class="tick" style="left:25%"></div>
          <div class="tick" style="left:50%"></div>
          <div class="tick" style="left:75%"></div>
          <div class="tick" style="left:100%"></div>
          <div class="needle" id="tunerNeedle"></div>
        </div>
        <div class="tuner-scale">
          <span>-50</span><span>-25</span><span>0</span><span>+25</span><span>+50</span>
        </div>
        <div class="tuner-raw" id="tunerRaw" data-i18n="tuner_no_signal">no signal</div>
      </div>
    </div>
  </div>

  <details class="log-panel">
    <summary data-i18n="log_title">Log</summary>
    <div id="log"></div>
  </details>

</div>

<script src="js/i18n.js"></script>
<script src="js/protocol.js"></script>
<script src="js/app.js"></script>
</body>
</html>
